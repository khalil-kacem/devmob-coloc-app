name: devmob_coloc_flutter_project
description: "A new Flutter project."

# Prevent publishing to pub.dev for private packages
publish_to: 'none'

# Version and build number
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Dependencies
dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  google_fonts: 6.2.0
  image_picker: ^1.1.2
  intl: ^0.18.1


  # State management
  flutter_riverpod: ^2.6.1

  # UI & Utilities
  google_sign_in: ^6.2.2
  fluttertoast: ^8.2.8
  uuid: ^4.5.0
  file_picker: 6.2.1

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Flutter specific configuration
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/
